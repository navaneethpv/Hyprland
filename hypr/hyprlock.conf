# ==============================================================================
# HYPRLOCK CONFIG - ATMOSPHERIC SAMURAI MIST
# ==============================================================================

# FONTS (Dynamic typography with natural lowercase)
# Font options:
# - Username: "Kaushan Script" (brush ink), "Syne Bold" (modern), "Space Grotesk Bold" (clean)
$fontTime  = Space Grotesk Bold
$fontDate  = Space Grotesk
$fontUser  = Kaushan Script
$fontQuote = Shippori Mincho
$fontIcons = CommitMono Nerd Font

# PALETTE (Matched to Samurai Theme with White Accents)
$fg_bright    = rgb(240, 248, 255)       # Crisp Ice White
$fg_mist      = rgb(190, 220, 235)       # Soft Rain Cyan
$border_white = rgb(255, 255, 255)       # Pure White Border
$border_glass = rgba(255, 255, 255, 0.8) # White Glass Border
$samurai_dark = rgba(15, 26, 36, 0.75)   # Frosted Rain Glass
$samurai_red  = rgb(215, 65, 65)         # Crimson Accent
$samurai_green= rgb(85, 205, 165)        # Jade Accent

# GENERAL
general {
  hide_cursor = true
}

# BACKGROUND (Light Frosted Mist Blur)
background {
  monitor =
  path = $HOME/.config/walpaper/lockscreen.jpg
  blur_passes = 1
  blur_size = 4
  noise = 0.0117
  contrast = 0.9
  brightness = 0.85
  color = rgb(15, 26, 36)
}

# USER AVATAR (Clean White Border)
image {
  monitor =
  path = $HOME/.config/hypr/avatar.png
  size = 115
  rounding = -1
  border_color = $border_white
  border_size = 2
  position = 0, 125
  halign = center
  valign = center
}

# USERNAME (Dynamic brush ink style with natural lowercase)
label {
  monitor =
  text = $USER
  color = $fg_bright
  font_size = 28
  font_family = $fontUser
  position = 0, 45
  halign = center
  valign = center
}

# LAYOUT
label {
  monitor =
  text = 󰌌  $LAYOUT
  color = $fg_mist
  font_size = 15
  font_family = $fontIcons
  position = 40, -30
  halign = left
  valign = top
}

# TIME (Sleek modern numerals)
label {
  monitor =
  text = $TIME
  color = $fg_bright
  font_size = 85
  font_family = $fontTime
  position = -40, -30
  halign = right
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $fg_mist
  font_size = 16
  font_family = $fontDate
  position = -40, -165
  halign = right
  valign = top
}

# INPUT FIELD (Frosted Lake Glass with Clean White Border)
input-field {
  monitor =
  size = 280, 50

  outline_thickness = 2
  outer_color = $border_glass
  inner_color = $samurai_dark

  dots_size = 0.25
  dots_spacing = 0.25
  dots_center = true
  dots_rounding = -1

  font_color = $fg_bright
  font_family = $fontDate

  fade_on_empty = false
  hide_input = false

  placeholder_text = <span foreground="##9abccb"><i>󰌾  Enter password...</i></span>

  check_color = $samurai_green
  fail_color = $samurai_red
  fail_text = <i>$FAIL (<b>$ATTEMPTS</b>)</i>
  capslock_color = rgb(235, 185, 80)

  position = 0, -35
  halign = center
  valign = center
}

# QUOTE
label {
  monitor =
  text = <i>"The blade reflects the mind — calm amidst the storm."</i>
  color = $fg_mist
  font_size = 15
  font_family = $fontQuote
  position = 0, 40
  halign = center
  valign = bottom
}