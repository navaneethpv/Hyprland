general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn on display after sleep
}

# 5 minutes of inactivity -> Lock Screen
listener {
    timeout = 300                                # 5min (300 seconds)
    on-timeout = loginctl lock-session           # lock screen when timeout has passed
}

# 5.5 minutes of inactivity -> Turn off display
listener {
    timeout = 330                                # 5.5min (330 seconds)
    on-timeout = hyprctl dispatch dpms off       # turn off screen
    on-resume = hyprctl dispatch dpms on         # turn on screen on resume
}
